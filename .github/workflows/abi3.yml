# Builds the stable-ABI (abi3) wheel on the oldest Python it supports and runs the tests with that wheel
# on the oldest and the newest Python. Anything the extension uses outside that version's limited API
# (e.g. a typed memoryview, which needs Py_buffer before Python 3.11) fails here, at compile or at import.

name: abi3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LIMITED_API: "3.9"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0
      - name: Set up Python ${{ env.LIMITED_API }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.LIMITED_API }}
      - name: Build the abi3 wheel
        env:
          LITTLEFS_PY_LIMITED_API: ${{ env.LIMITED_API }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: abi3-wheel-${{ matrix.os }}
          path: dist/*-abi3-*.whl
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: abi3-wheel-${{ matrix.os }}
          path: dist
      - name: Install the abi3 wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dist/*-abi3-*.whl
      - name: Test with pytest
        run: |
          pytest
