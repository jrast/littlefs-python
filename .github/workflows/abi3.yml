# Builds the stable-ABI (abi3) wheel on the oldest Python it supports and runs the tests with it. Anything
# the extension uses outside that version's limited API (e.g. a typed memoryview, which needs Py_buffer
# before Python 3.11) fails here, at compile or at import. Later Pythons are covered by the stable ABI's own
# guarantee.

name: abi3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LIMITED_API: "3.9"

jobs:
  abi3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0
      - name: Set up Python ${{ env.LIMITED_API }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.LIMITED_API }}
      - name: Build the abi3 wheel
        env:
          LITTLEFS_PY_LIMITED_API: ${{ env.LIMITED_API }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the abi3 wheel
        run: |
          pip install -r requirements.txt
          pip install dist/*-abi3-*.whl
          python -c "import littlefs.lfs as m; assert m.__file__.endswith('.abi3.so'), m.__file__; print(m.__file__)"
      - name: Test with pytest
        run: |
          pytest
